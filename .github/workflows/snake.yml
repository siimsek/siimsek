name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1F4E8C&color_dots=#ebedf0,#c6d8f0,#8fb3e3,#4f86cf,#1f4e8c
            dist/snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0e2a4d,#164a8a,#2f6fc8,#58a6ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
