  <text x="390" y="504" font-size="18" font-weight="400" fill="#6E6E73" text-anchor="start" letter-spacing="0" style="animation-delay:0.30000000000000004s">Founding Member &amp; Vice President · Akdeniz University</text>
  <text x="390" y="544" font-size="19" fill="#6E6E73" style="animation-delay:0.30000000000000004s"><tspan x="390" dy="0">Coordinating 23 engineering projects and leading hardware/software</tspan><tspan x="390" dy="30">integration and on-water testing as captain of the TEKNOFEST 2026 finalist</tspan><tspan x="390" dy="30">USV team.</tspan></text>
