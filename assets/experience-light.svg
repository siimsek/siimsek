<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Experience — Crystal Endüstriyel; Project &amp; Engineering Society">
  <title>Experience — Crystal Endüstriyel; Project &amp; Engineering Society</title>
  <style>
    text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .up { animation:up 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    
  </style>
  <text x="110" y="70" font-size="20" font-weight="600" fill="#6E6E73" text-anchor="start" letter-spacing="0">Experience</text>
  <text x="110" y="140" font-size="52" font-weight="700" fill="#1D1D1F" text-anchor="start" letter-spacing="-1.4" style="animation-delay:0.1s">Engineering in industry</text>
  <text x="110" y="200" font-size="52" font-weight="700" fill="#1D1D1F" text-anchor="start" letter-spacing="-1.4" style="animation-delay:0.1s">and student teams.</text>
  <rect x="110" y="230" width="980" height="1" fill="#D2D2D7"/>
  <text x="110" y="282" font-size="18" font-weight="500" fill="#86868B" text-anchor="start" letter-spacing="0" style="animation-delay:0.2s">Jul–Sep 2026</text>
  <text x="390" y="282" font-size="28" font-weight="600" fill="#1D1D1F" text-anchor="start" letter-spacing="-0.5" style="animation-delay:0.2s">Crystal Endüstriyel</text>
  <text x="390" y="314" font-size="18" font-weight="400" fill="#6E6E73" text-anchor="start" letter-spacing="0" style="animation-delay:0.2s">Electronics R&amp;D Intern · Antalya</text>
  <text x="390" y="354" font-size="19" fill="#6E6E73" style="animation-delay:0.2s"><tspan x="390" dy="0">Machine control software with Delta PLC and WPLSoft, HMI screens in</tspan><tspan x="390" dy="30">DOPSoft, and KiCad schematics, PCB layouts and hardware prototypes.</tspan></text>
  <rect x="110" y="420" width="980" height="1" fill="#D2D2D7"/>
  <text x="110" y="472" font-size="18" font-weight="500" fill="#86868B" text-anchor="start" letter-spacing="0" style="animation-delay:0.30000000000000004s">May 2025 – present</text>
