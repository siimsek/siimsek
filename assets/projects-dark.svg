<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Selected projects — Hardware that leaves the lab.">
  <title>Selected projects — Hardware that leaves the lab.</title>
  <style>
    text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .up { animation:up 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    
  </style>
  <text x="110" y="70" font-size="20" font-weight="600" fill="#A1A1A6" text-anchor="start" letter-spacing="0">Selected projects</text>
  <text x="110" y="140" font-size="52" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.4" style="animation-delay:0.1s">Hardware that leaves</text>
  <text x="110" y="200" font-size="52" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.4" style="animation-delay:0.1s">the lab.</text>
</svg>
