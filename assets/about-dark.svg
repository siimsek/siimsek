<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="About — From circuit design to field testing.">
  <title>About — From circuit design to field testing.</title>
  <style>
    text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .up { animation:up 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    
  </style>
  <text x="110" y="70" font-size="20" font-weight="600" fill="#A1A1A6" text-anchor="start" letter-spacing="0">About</text>
  <text x="110" y="140" font-size="60" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.6" style="animation-delay:0.1s">From circuit design</text>
  <text x="110" y="208" font-size="60" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.6" style="animation-delay:0.1s">to field testing.</text>
  <text x="110" y="272" font-size="22" fill="#A1A1A6" style="animation-delay:.2s"><tspan x="110" dy="0">I am a final-year Electrical and Electronics Engineering student at Akdeniz University. I</tspan><tspan x="110" dy="34">work on power electronics, PCB design, and embedded systems, connecting hardware with</tspan><tspan x="110" dy="34">software and industrial automation.</tspan><tspan x="110" dy="34"> </tspan><tspan x="110" dy="34">I captain the TEKNOFEST 2026 finalist Unmanned Surface Vehicle (USV) team and developed</tspan><tspan x="110" dy="34">most of its electronics and software subsystems. I also coordinate 23 engineering</tspan><tspan x="110" dy="34">projects through the university’s Project &amp; Engineering Society.</tspan></text>
  <rect x="110" y="536" width="980" height="1" fill="#30363D"/>
  <text x="110" y="606" font-size="56" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.5" style="animation-delay:0.3s">2026</text>
  <text x="110" y="644" font-size="18" font-weight="400" fill="#A1A1A6" text-anchor="start" letter-spacing="0" style="animation-delay:0.3s">TEKNOFEST finalist</text>
  <text x="450" y="606" font-size="56" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.5" style="animation-delay:0.38s">23</text>
  <text x="450" y="644" font-size="18" font-weight="400" fill="#A1A1A6" text-anchor="start" letter-spacing="0" style="animation-delay:0.38s">Projects coordinated</text>
  <text x="790" y="606" font-size="56" font-weight="700" fill="#F5F5F7" text-anchor="start" letter-spacing="-1.5" style="animation-delay:0.45999999999999996s">EEE</text>
  <text x="790" y="644" font-size="18" font-weight="400" fill="#A1A1A6" text-anchor="start" letter-spacing="0" style="animation-delay:0.45999999999999996s">Akdeniz University</text>
</svg>
