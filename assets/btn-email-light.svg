<svg xmlns="http://www.w3.org/2000/svg" width="173" height="56" viewBox="0 0 173 56" role="img" aria-label="Get in touch">
  <title>Get in touch</title>
  <style>
    text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .up { animation:up 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    
  </style>
  <rect x="1" y="1" width="171" height="54" rx="27.0" fill="#1D1D1F"/>
  <text x="86.5" y="35" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Get in touch</text>
</svg>
