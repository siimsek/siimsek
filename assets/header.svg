    .role { font:500 22px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#E6EDF3; }
    .wave { fill:none; stroke:#C8FF00; stroke-width:2; stroke-opacity:.55; stroke-dasharray:1400; animation:draw 6s ease-in-out infinite; }
    .led { animation:blink 2.4s ease-in-out infinite; }
    .core { animation:breathe 3.2s ease-in-out infinite; transform-origin:990px 230px; }
    .rise { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes run { to { stroke-dashoffset:0; } }
    @keyframes draw { 0% { stroke-dashoffset:1400; } 55%,100% { stroke-dashoffset:0; } }
    @keyframes blink { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  </style>
