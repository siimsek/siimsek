  <text x="50" y="262" font-size="16" font-weight="600" fill="#86868B" text-anchor="start" letter-spacing="0.2">SENIOR DESIGN · POWER ELECTRONICS</text>
  <text x="50" y="306" font-size="32" font-weight="700" fill="#1D1D1F" text-anchor="start" letter-spacing="-0.8">Modular Power Distribution Unit</text>
  <text x="50" y="352" font-size="19" fill="#6E6E73"><tspan x="50" dy="0">A single-phase asynchronous buck converter that</tspan><tspan x="50" dy="29">turns the boat’s 6S battery into a clean 11 V rail for</tspan><tspan x="50" dy="29">its sensors and compute.</tspan></text>
  <rect x="50" y="444" width="500" height="1" fill="#D2D2D7"/><text x="50" y="476" font-size="16" font-weight="500" fill="#86868B" text-anchor="start" letter-spacing="0">Input</text><text x="170" y="476" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">6S battery · 20–26 V</text><rect x="50" y="506" width="500" height="1" fill="#D2D2D7"/><text x="50" y="538" font-size="16" font-weight="500" fill="#86868B" text-anchor="start" letter-spacing="0">Output</text><text x="170" y="538" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">11 V · 7.5 A · 82.5 W</text><rect x="50" y="568" width="500" height="1" fill="#D2D2D7"/><text x="50" y="600" font-size="16" font-weight="500" fill="#86868B" text-anchor="start" letter-spacing="0">Verified</text><text x="170" y="600" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">55.7 mV ripple · ≈96% efficiency</text><rect x="50" y="630" width="500" height="1" fill="#D2D2D7"/><text x="50" y="662" font-size="16" font-weight="500" fill="#86868B" text-anchor="start" letter-spacing="0">Tools</text><text x="170" y="662" font-size="17" font-weight="500" fill="#1D1D1F" text-anchor="start" letter-spacing="0">KiCad · LTspice · Python</text>
