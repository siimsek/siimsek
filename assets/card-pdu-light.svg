<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-label="Modular Power Distribution Unit — 6S to 11 V, 82.5 W buck converter">
  <title>Modular Power Distribution Unit — 6S to 11 V, 82.5 W buck converter</title>
  <style>
    text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .up { animation:up 1s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
    
  </style>
  <rect x="0" y="0" width="600" height="720" rx="28" fill="#F5F5F7"/>
  <g transform="translate(0,6)"><g fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 90 H190"/>
      <path d="M190 90 L222 72 M222 90 H250"/>
      <circle cx="190" cy="90" r="3" fill="#6E6E73"/>
      <path d="M250 90 a12 12 0 0 1 24 0 a12 12 0 0 1 24 0 a12 12 0 0 1 24 0 a12 12 0 0 1 24 0 a12 12 0 0 1 24 0 "/>
      <path d="M370 90 H470"/>
      <path d="M250 90 V122 M238 122 H262 M250 122 L240 140 H260 Z"/>
      <path d="M250 140 V180"/>
      <path d="M420 90 V122 M406 122 H434 M406 132 H434 M420 132 V180"/>
      <path d="M120 180 H470"/>
      <circle cx="120" cy="90" r="4"/><circle cx="470" cy="90" r="4"/>
