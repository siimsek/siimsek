<svg xmlns="http://www.w3.org/2000/svg" width="600" height="316" viewBox="0 0 600 316" role="img" aria-label="Lightning Kernel — ARM64 ANDROID KERNEL">
  <title>Lightning Kernel — ARM64 ANDROID KERNEL</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101826"/><stop offset="1" stop-color="#070B12"/></linearGradient>
    <radialGradient id="gl" cx="0.08" cy="0.1" r="0.6"><stop offset="0" stop-color="#34D399" stop-opacity=".16"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient>
    <clipPath id="f"><rect width="600" height="316" rx="20"/></clipPath>
  </defs>
  <style>
    .t { font:800 30px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill:#E6EDF3; letter-spacing:-.5px; }
    .s { font:600 14px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#34D399; letter-spacing:.5px; }
    .d { font:400 16px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill:#8B98A9; }
    .pill { font:600 12.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#E6EDF3; }
    .bd { font:700 12px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#34D399; letter-spacing:1.2px; }
    .sweep { animation:sw 5s ease-in-out infinite; animation-delay:4.0s; }
    @keyframes sw { 0% { transform:translateX(-320px); } 60%,100% { transform:translateX(620px); } }
  </style>
  <g clip-path="url(#f)">
    <rect width="600" height="316" fill="url(#bg)"/>
    <rect width="600" height="316" fill="url(#gl)"/>
    <rect class="sweep" x="0" y="0" width="300" height="3" fill="url(#edge)"/>
  </g>
  <rect x="1" y="1" width="598" height="314" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
  <g transform="translate(28,26) scale(.78)"><rect x="20" y="20" width="40" height="40" rx="6" fill="none" stroke="#34D399" stroke-width="3.5"/><rect x="31" y="31" width="18" height="18" rx="3" fill="#34D399" fill-opacity=".85"/><path d="M28 20 V12 M40 20 V12 M52 20 V12 M28 60 V68 M40 60 V68 M52 60 V68 M20 28 H12 M20 40 H12 M20 52 H12 M60 28 H68 M60 40 H68 M60 52 H68" stroke="#34D399" stroke-width="3" stroke-linecap="round"/></g>
  <rect x="462" y="34" width="102" height="28" rx="14" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".5"/>
  <text x="513" y="53" text-anchor="middle" class="bd">LOW-LEVEL</text>
  <text x="36" y="128" class="t">Lightning Kernel</text>
  <text x="36" y="154" class="s">ARM64 ANDROID KERNEL</text>
  <text x="36" y="188" class="d"><tspan x="36" dy="0">Linux 4.14-based custom kernel for Redmi Note 8/8T (ginkgo)</tspan><tspan x="36" dy="24">with KernelSU support, plus the POP-ZRAM Magisk module.</tspan></text>
  <rect x="36" y="252" width="34" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="53" y="272" text-anchor="middle" class="pill">C</text><rect x="79.9" y="252" width="66" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="113" y="272" text-anchor="middle" class="pill">Linux</text><rect x="155.4" y="252" width="66" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="188" y="272" text-anchor="middle" class="pill">ARM64</text><rect x="230.9" y="252" width="89" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="276" y="272" text-anchor="middle" class="pill">KernelSU</text>
</svg>
