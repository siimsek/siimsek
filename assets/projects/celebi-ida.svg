  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101826"/><stop offset="1" stop-color="#070B12"/></linearGradient>
    <radialGradient id="gl" cx="0.08" cy="0.1" r="0.6"><stop offset="0" stop-color="#C8FF00" stop-opacity=".16"/><stop offset="1" stop-color="#C8FF00" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#C8FF00" stop-opacity="0"/><stop offset=".5" stop-color="#C8FF00"/><stop offset="1" stop-color="#C8FF00" stop-opacity="0"/></linearGradient>
    <clipPath id="f"><rect width="600" height="316" rx="20"/></clipPath>
  </defs>
  <style>
    .t { font:800 30px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill:#E6EDF3; letter-spacing:-.5px; }
