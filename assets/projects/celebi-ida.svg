  <rect x="1" y="1" width="598" height="314" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
  <g transform="translate(28,26) scale(.78)"><path d="M14 40 H66 L58 54 H22 Z" fill="none" stroke="#C8FF00" stroke-width="3.5" stroke-linejoin="round"/><path d="M40 14 V40 M40 16 L56 34 H40" fill="none" stroke="#C8FF00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M10 64 q7 -6 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#C8FF00" stroke-width="3" stroke-linecap="round"/></g>
