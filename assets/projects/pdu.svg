<svg xmlns="http://www.w3.org/2000/svg" width="600" height="316" viewBox="0 0 600 316" role="img" aria-label="PDU — PROTECTED POWER STAGE · CAPSTONE">
  <title>PDU — PROTECTED POWER STAGE · CAPSTONE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101826"/><stop offset="1" stop-color="#070B12"/></linearGradient>
    <radialGradient id="gl" cx="0.08" cy="0.1" r="0.6"><stop offset="0" stop-color="#FFB020" stop-opacity=".16"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#FFB020" stop-opacity="0"/><stop offset=".5" stop-color="#FFB020"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></linearGradient>
    <clipPath id="f"><rect width="600" height="316" rx="20"/></clipPath>
  </defs>
  <style>
    .t { font:800 30px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill:#E6EDF3; letter-spacing:-.5px; }
    .s { font:600 14px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#FFB020; letter-spacing:.5px; }
    .d { font:400 16px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill:#8B98A9; }
    .pill { font:600 12.5px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#E6EDF3; }
    .bd { font:700 12px ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill:#FFB020; letter-spacing:1.2px; }
    .sweep { animation:sw 5s ease-in-out infinite; animation-delay:0.8s; }
    @keyframes sw { 0% { transform:translateX(-320px); } 60%,100% { transform:translateX(620px); } }
  </style>
  <g clip-path="url(#f)">
    <rect width="600" height="316" fill="url(#bg)"/>
    <rect width="600" height="316" fill="url(#gl)"/>
    <rect class="sweep" x="0" y="0" width="300" height="3" fill="url(#edge)"/>
  </g>
  <rect x="1" y="1" width="598" height="314" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
  <g transform="translate(28,26) scale(.78)"><path d="M46 10 L20 44 H38 L32 70 L60 34 H42 Z" fill="none" stroke="#FFB020" stroke-width="3.5" stroke-linejoin="round"/></g>
  <rect x="462" y="34" width="102" height="28" rx="14" fill="#FFB020" fill-opacity=".1" stroke="#FFB020" stroke-opacity=".5"/>
  <text x="513" y="53" text-anchor="middle" class="bd">IN DESIGN</text>
  <text x="36" y="128" class="t">PDU</text>
  <text x="36" y="154" class="s">PROTECTED POWER STAGE · CAPSTONE</text>
  <text x="36" y="188" class="d"><tspan x="36" dy="0">6S (20–26 V) → 11 V / 7.5 A buck power stage for robotic</tspan><tspan x="36" dy="24">payloads like LiDAR and AI compute — dimensioned and</tspan><tspan x="36" dy="24">verified in LTspice.</tspan></text>
  <rect x="36" y="252" width="66" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="69" y="272" text-anchor="middle" class="pill">KiCad</text><rect x="111.5" y="252" width="81" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="152" y="272" text-anchor="middle" class="pill">LTspice</text><rect x="202.8" y="252" width="160" height="30" rx="15" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/><text x="283" y="272" text-anchor="middle" class="pill">Power Electronics</text>
</svg>
